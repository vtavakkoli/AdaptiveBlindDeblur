name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Python 3.13 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and development tools
        run: |
          python -m pip install -U pip
          python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Unit and regression tests
        run: python -m pytest -q tests

  ugdb-smoke:
    name: UGDB three-image ablation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare output directory
        run: mkdir -p results
      - name: Build UGDB experiment container
        run: docker compose build ugdb-experiment
      - name: Run three-image UGDB ablation
        run: >-
          docker compose run --rm ugdb-experiment
          --limit 3 --steps 2 --kernel-hypotheses 3 --seed 7
      - name: Verify and print UGDB result
        run: |
          test -f results/ugdb_experiment/report.html
          test -f results/ugdb_experiment/report.json
          test -f results/ugdb_experiment/SUMMARY.md
          cat results/ugdb_experiment/SUMMARY.md
      - name: Publish UGDB summary
        run: cat results/ugdb_experiment/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload UGDB smoke report
        uses: actions/upload-artifact@v4
        with:
          name: ugdb-ablation-smoke
          path: results/ugdb_experiment/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  docker-compose:
    name: Full-quality native-resolution benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Prepare output directory
        run: mkdir -p results
      - name: Build benchmark container
        run: docker compose build test
      - name: Run complete full-quality benchmark
        run: docker compose run --rm test
      - name: Verify benchmark contract
        run: |
          test -f results/report.html
          test -f results/report.json
          test -f results/SUMMARY.md
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          # Reuse the exact same five-method validator that the Docker test uses.
          # This prevents the GitHub Actions contract from drifting when benchmark
          # methods, per-method PSFs, or winner metadata are extended.
          sys.path.insert(0, str(Path("scripts").resolve()))
          from run_docker_test import EXPECTED_IMAGES, METHODS, validate_report

          report = json.loads(Path("results/report.json").read_text(encoding="utf-8"))
          validate_report(report)

          winner = report["overall_winner"]
          winner_name = report["methods"][winner]["name"]
          print(
              f"Verified {EXPECTED_IMAGES} native-resolution sources, "
              f"{EXPECTED_IMAGES * len(METHODS)} restorations, "
              f"{EXPECTED_IMAGES * len(METHODS)} PSF visualizations, "
              f"zero resizing, and overall winner={winner_name}."
          )
          PY
      - name: Publish benchmark summary
        run: cat results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload native-resolution comparison report
        uses: actions/upload-artifact@v4
        with:
          name: deblurring-native-resolution-report
          path: results/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
