name: Apply Browser Quality Fix

on:
  push:
    branches:
      - fix/browser-before-after-quality

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[browser-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/browser-before-after-quality
          fetch-depth: 0
      - name: Apply Browser Lab fixes
        run: python scripts/apply_browser_quality_fix.py
      - name: Validate generated browser assets
        run: |
          node --check docs/browser-lab.js
          python -m py_compile tests/test_report_assets.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/browser-lab.css docs/browser-lab.js tests/test_report_assets.py
          git commit -m "Fix Browser Lab comparison and quality parity [browser-fix-applied]"
          git push origin HEAD:fix/browser-before-after-quality
