[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-channel-deblur"
version = "0.4.0"
description = "Experimental native-resolution blind deblurring with adaptive PSF estimation and artifact-guarded refinements."
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Vahid Tavakkoli" },
]
keywords = [
  "blind-deblurring",
  "psf-estimation",
  "image-restoration",
  "plug-and-play",
  "computer-vision",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "opencv-python-headless>=4.10,<5",
  "numba>=0.61,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
dark-channel-deblur = "dark_channel_deblur.cli:main"

[project.urls]
Repository = "https://github.com/vtavakkoli/debluring"
Issues = "https://github.com/vtavakkoli/debluring/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
