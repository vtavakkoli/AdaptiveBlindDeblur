[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-channel-deblur"
version = "0.2.0"
description = "Fast Python blind deblurring with dark-channel baseline, annealed PnP, and extreme-channel research refinements."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "opencv-python-headless>=4.10,<5",
  "numba>=0.61,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
dark-channel-deblur = "dark_channel_deblur.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"
